apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthz
  namespace: platform-demo
  labels:
    app.kubernetes.io/name: healthz
    app.kubernetes.io/part-of: platform-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: healthz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthz
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: healthz
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
